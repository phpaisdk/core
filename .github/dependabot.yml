version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Widen constraints instead of replacing them, so a new major never drops the versions apps still use.
    versioning-strategy: widen
    cooldown:
      default-days: 5
