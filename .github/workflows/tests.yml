name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        guzzle: ['^7.15.2', '^8.3.0']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Install with Guzzle ${{ matrix.guzzle }}
        run: |
          composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --no-scripts -W
      - run: composer lint
      - run: composer analyze
      - run: vendor/bin/pest
      - run: composer audit --ignore-unreachable
